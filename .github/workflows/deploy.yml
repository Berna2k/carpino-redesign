name: Publicar vista previa en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@v7

      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar para la ruta del repositorio
        run: npm run build -- --base /carpino-redesign/

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v6

      - name: Subir archivos compilados
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v5
